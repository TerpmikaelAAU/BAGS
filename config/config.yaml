# Assemblies to analyse. Set Taxon, Accessions and/or Accessions_file; all given sources are combined.

# Every GenBank assembly of this NCBI taxon (name or taxid). Leave as [] to use accessions only.
Taxon: [Ganoderma lucidum]

# Only NCBI's reference genomes of the Taxon (at most one per species; many species
# have none), as their GenBank (GCA_) copies. true or false.
Reference_only: false

# Specific NCBI assembly accessions (GCA_ or GCF_), downloaded as given.
Accessions: []
#  - GCA_000149305.1
#  - GCA_000271645.1

# Optional text file with one accession per line (# starts a comment), e.g. config/accessions.txt
Accessions_file: ""

# Also build a UFCG core-gene phylogeny (61 fungal marker genes, IQ-TREE). true or false.
UFCG: false
