# Configuration for the Rhizopus microsporus var. oligosporus CBS 337.62 workflow.
# Relative paths are relative to the Rhizopus_microsporus_T2T/ folder, which is
# where snakemake (and run_workflow.sbatch) runs. The only input files you
# supply are the `gbk` and `fasta` files under `annotated_genomes` (and
# `long_reads.fastq` if you set it); everything else is downloaded.

results: results

# Which parts of the workflow `snakemake` (target `all`) builds.
targets:
  annotation_circos: true      # CBS 337.62, Redundans and the six comparison genomes
  whole_genome_synteny: true   # CBS 337.62 vs RT-3
  longread_coverage: true      # ultra-long reads + read depth, per chromosome pair
  phylogeny: true              # UFCG tree
  telomere_finder: true        # tidk motif search for every annotated genome

# Container image per tool group. Every rule runs in one of these with
# Apptainer; no conda environments are built. Run `bash pull_containers.sh` on
# a login node once to pull the images into `folder` as <name>.sif (BioCloud
# cannot build .sif files inside SLURM jobs). The images were built by Seqera
# Containers from the package lists in workflow/containers/<name>.yaml.
containers:
  folder: containers
  images:
    circos: docker://community.wave.seqera.io/library/python_pycirclize_pygenomeviz_biopython_pruned:c4d6db338508919f
    tidk: docker://community.wave.seqera.io/library/tidk_python:c6028460f1a33d71
    reads: docker://community.wave.seqera.io/library/minimap2_chopper_seqkit_pigz_curl:c8011be91249b66e
    ncbi: docker://community.wave.seqera.io/library/ncbi-datasets-cli_unzip:55fdb7d2d283940e
    ufcg: docker://community.wave.seqera.io/library/ufcg_openjdk_augustus_mmseqs2_pruned:2cceed264718ef27

# ---------------------------------------------------------------------------
# Public assemblies, downloaded with NCBI datasets into
# results/genomes/ncbi/<name>.fna
# ---------------------------------------------------------------------------
ncbi_genomes:
  Rhizopus_microsporus_var._oligosporus_CBS_337.62: GCA_060230415.1   # this study
  Rhizopus_microsporus_var._oligosporus_RT-3: GCA_040206765.1
  Rhizopus_microsporus_MLY36: GCA_034509365.1
  Rhizopus_microsporus_ATCC_52813: GCF_002708625.1
  Rhizopus_azygosporus_CBS_357.93: GCA_003325435.1
  Rhizopus_delemar_SE_PDA7: GCA_054127015.1
  Rhizopus_delemar_RA_99-880: GCF_000149305.1
  Rhizopus_arrhizus_Z10C7: GCA_048164915.1
  Rhizopus_stolonifer_PRFJ02: GCA_054954275.1

# ---------------------------------------------------------------------------
# Annotated genomes drawn with annotation_circos.py (gene tracks, telomeres,
# nucmer --maxmatch self-alignment). The GenBank files are the funannotate
# outputs (with antiSMASH and CAZy notes); see README "Input files".
#
#   gbk             annotated GenBank file
#   fasta           sequence for the self-alignment; default = the GenBank sequence
#   title           plot title
#   exclude         contigs left out of the plot
#   telomere_motif  tidk search motif for the telomere track; null = no track
#   nucmer_minmatch nucmer -l (20 is the nucmer default)
#   nucmer_hours    SLURM time limit for the self-alignment
# ---------------------------------------------------------------------------
annotated_genomes:
  R_microsporus_CBS_337.62:
    gbk: data/annotation/Rhizopus_microsporus_var._oligosporus_337.62.gbk
    title: Rhizopus microsporus var. oligosporus CBS 337.62
    exclude: [chr_14, chr_15]        # unplaced contig and mitochondrion
    telomere_motif: AACCGCAACCGC
    nucmer_minmatch: 20
    nucmer_hours: 48
  R_microsporus_CBS_337.62_Redundans:
    gbk: data/annotation/Rhizopus_microsporus.Redundans.gbk
    title: Rhizopus microsporus - Redundans
    exclude: [chr_9]
    telomere_motif: AACCGCAACCGC
    nucmer_minmatch: 20
    nucmer_hours: 48
  # Comparison genomes (supplementary figure). The published panels only have a telomere
  # track for R. stolonifer PRFJ02; set a motif (see results/telomere_finder/)
  # to add one for the others.
  R_arrhizus_Z10C7:
    gbk: data/annotation/Rhizopus_arrhizus_Z10C7.gbk
    fasta: data/annotation/Rhizopus_arrhizus_Z10C7_masked.fasta
    title: Rhizopus_arrhizus_Z10C7
    telomere_motif: null
    nucmer_minmatch: 20
    nucmer_hours: 72
  R_delemar_SE_PDA7:
    gbk: data/annotation/Rhizopus_delemar_SE_PDA7.gbk
    fasta: data/annotation/Rhizopus_delemar_SE_PDA7_masked.fasta
    title: Rhizopus_delemar_SE_PDA7
    telomere_motif: null
    nucmer_minmatch: 20
    nucmer_hours: 72
  R_microsporus_gzRhiMicr1:
    gbk: data/annotation/Rhizopus_microsporus_gzRhiMicr1_genomic.gbk
    fasta: data/annotation/Rhizopus_microsporus_gzRhiMicr1_genomic_masked.fasta
    title: Rhizopus_microsporus_gzRhiMicr1_genomic
    telomere_motif: null
    nucmer_minmatch: 20
    nucmer_hours: 72
  R_microsporus_MLY36:
    gbk: data/annotation/Rhizopus_microsporus_MLY36.gbk
    fasta: data/annotation/Rhizopus_microsporus_MLY36_masked.fasta
    title: Rhizopus_microsporus_MLY36
    telomere_motif: null
    nucmer_minmatch: 20
    nucmer_hours: 72
  R_microsporus_var_oligosporus_RT-3:
    gbk: data/annotation/Rhizopus_microsporus_var._oligosporus_RT-3.gbk
    fasta: data/annotation/Rhizopus_microsporus_var._oligosporus_RT-3_masked.fasta
    title: Rhizopus_microsporus_var._oligosporus_RT-3
    telomere_motif: null
    nucmer_minmatch: 20
    nucmer_hours: 72
  R_stolonifer_PRFJ02:
    gbk: data/annotation/Rhizopus_stolonifer_PRFJ02.gbk
    fasta: data/annotation/Rhizopus_stolonifer_PRFJ02_masked.fasta
    title: Rhizopus_stolonifer_PRFJ02
    telomere_motif: AACCACAACCAC
    nucmer_minmatch: 20                # very repeat rich: -l 20 needs days; -l 50 finishes in hours
    nucmer_hours: 168

self_links:
  min_length: 15000          # only duplicated blocks >= 15 kb are drawn
telomere:
  window: 10000              # tidk search window
  min_repeats: 5             # a window counts as telomeric with > 5 repeats on either strand
plot_dpi: 600

# ---------------------------------------------------------------------------
# Whole-genome synteny: CBS 337.62 against RT-3 with MUMmer
# ---------------------------------------------------------------------------
whole_genome_synteny:
  reference: Rhizopus_microsporus_var._oligosporus_RT-3        # key in ncbi_genomes
  reference_label: Rhizopus microsporus var. oligosporus RT-3
  query: R_microsporus_CBS_337.62                              # key in annotated_genomes
  query_exclude: [chr_14]                                      # unplaced contig
  query_label: Rhizopus microsporus var. oligosporus 337.62
  dpi: 300

# ---------------------------------------------------------------------------
# Long-read support. Reads are fetched from ENA unless
# `fastq` points to a local (gzipped) FASTQ.
# ---------------------------------------------------------------------------
long_reads:
  genome: R_microsporus_CBS_337.62      # key in annotated_genomes
  run: SRR36829118                      # TODO confirm: SRR36829118 or SRR36829119 (PRJNA1389883)
  fastq: null
  ultralong_min_length: 50000           # chopper --minlength for the ultra-long read track
  depth_min_length: 10000               # seqkit seq -m for the read-depth track
  depth_window: 5000
  chromosome_groups:
    - [chr_1, chr_2]
    - [chr_3, chr_4]
    - [chr_5, chr_6]
    - [chr_7, chr_8]
    - [chr_9, chr_10]
    - [chr_11, chr_12, chr_13]

# ---------------------------------------------------------------------------
# Phylogeny: UFCG profile + tree on these ncbi_genomes
# ---------------------------------------------------------------------------
phylogeny:
  genomes:
    - Rhizopus_microsporus_var._oligosporus_CBS_337.62
    - Rhizopus_microsporus_var._oligosporus_RT-3
    - Rhizopus_microsporus_MLY36
    - Rhizopus_microsporus_ATCC_52813
    - Rhizopus_azygosporus_CBS_357.93
    - Rhizopus_delemar_SE_PDA7
    - Rhizopus_delemar_RA_99-880
    - Rhizopus_arrhizus_Z10C7
    - Rhizopus_stolonifer_PRFJ02
  outgroup: Rhizopus_stolonifer_PRFJ02
  highlight: [Rhizopus_microsporus_var._oligosporus_CBS_337.62]
  # CBS 337.62 carries two copies of most UFCG markers (52 of 61), which UFCG leaves
  # out of the gene trees by default. true = `ufcg tree -c` (align multi-copy genes too).
  align_multicopy: true
  threads: 30
  # UFCG's core-gene database (its `config/` folder, about 135 MB). Empty = the
  # workflow downloads it from the UFCG server (rule ufcg_resources). If that
  # server refuses (HTTP 429), point this to an existing copy instead, e.g. the
  # one in a conda env where UFCG has run before:
  #   <env>/share/ufcg-1.0.6-0/config
  ufcg_config: ""
