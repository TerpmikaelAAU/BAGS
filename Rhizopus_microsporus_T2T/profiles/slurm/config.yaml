# Snakemake profile for the AAU BioCloud SLURM cluster
# (https://cmc-aau.github.io/biocloud-docs/slurm/jobcontrol/).
# Every rule runs as its own sbatch job; CPUs come from each rule's `threads`.
executor: slurm
jobs: 50
# Every rule runs in its container (containers/<name>.sif, see pull_containers.sh).
# On BioCloud /home, /projects, /raw_data and /databases are mounted in the
# containers; elsewhere, mount the folders your data/ symlinks point to with
# apptainer-args: "--bind /path/to/data"
software-deployment-method: apptainer
latency-wait: 60
rerun-incomplete: true
printshellcmds: true
keep-going: true
show-failed-logs: true
default-resources:
  slurm_partition: shared
  mem_mb: 8000
  runtime: 60
