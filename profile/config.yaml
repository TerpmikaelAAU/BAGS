# Jobs are submitted by the SLURM executor plugin.
executor: slurm
software-deployment-method:
  - conda
# Defaults for rules that do not set them. runtime is in minutes.
# No slurm_partition: BioCloud picks the partition from the mem-per-CPU ratio.
default-resources:
  runtime: 60
  mem_mb: 512
  qos: "normal"
#max threads per job/rule. Will take precedence over anything else. Adjust this
#before submitting to SLURM and leave threads settings elsewhere untouched
max-threads: 32
jobs: 50
local-cores: 1
latency-wait: 120
retries: 0
max-jobs-per-second: 10 #don't touch
max-status-checks-per-second: 5
keep-going: True
rerun-incomplete: True
scheduler: greedy
printshellcmds: False
show-failed-logs: True
slurm-keep-successful-logs: True
slurm-efficiency-report: True
